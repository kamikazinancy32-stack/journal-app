<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A personal journal inspired by Rwandan Imigongo art." />
    <title>Imigongo Journal</title>
  </head>
  <body>
    <a class="skip-link" href="#entry-title">Skip to the journal form</a>

    <header class="site-header">
      <div class="site-header__inner">
        <div class="brand">
          <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <path d="M20 20h4v4h-8v-8h12v12H12V12h20v20H8V8h28v28H4V4h32" />
          </svg>
          <div>
            <h1 class="brand__title">Imigongo <span>Journal</span></h1>
            <p class="brand__tagline">Write your days in bold lines.</p>
          </div>
        </div>
      </div>
      <div class="band band--zigzag" aria-hidden="true"></div>
    </header>

    <main class="layout">
      <section class="panel panel--form" aria-labelledby="form-heading">
        <h2 id="form-heading" class="panel__title">New entry</h2>
        <form id="entry-form" class="entry-form" novalidate>
          <div class="field">
            <label for="entry-title">Title</label>
            <input id="entry-title" name="title" type="text" maxlength="120" autocomplete="off" required />
          </div>

          <div class="field-row">
            <div class="field">
              <label for="entry-date">Date</label>
              <input id="entry-date" name="date" type="date" required />
            </div>
            <div class="field">
              <label for="entry-mood">Mood</label>
              <select id="entry-mood" name="mood"></select>
            </div>
          </div>

          <div class="field">
            <label for="entry-content">What happened today?</label>
            <textarea id="entry-content" name="content" rows="8" required></textarea>
          </div>

          <p id="form-error" class="form-error" role="alert" hidden></p>

          <div class="form-actions">
            <button id="entry-submit" class="btn btn--primary" type="submit">Save entry</button>
            <button id="entry-cancel" class="btn btn--ghost" type="button" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel panel--entries" aria-labelledby="entries-heading">
        <div class="entries-head">
          <h2 id="entries-heading" class="panel__title">Your entries</h2>
          <p id="entry-count" class="entry-count" aria-live="polite"></p>
        </div>
        <div id="toolbar" class="toolbar"></div>
        <div id="entry-list" class="entry-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="band band--teeth" aria-hidden="true"></div>
      <p>Patterns inspired by Imigongo, the cow-dung art of Rwanda. Entries stay in this browser.</p>
    </footer>

    <p id="announcer" class="sr-only" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
