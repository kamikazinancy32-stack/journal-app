<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A quiet, minimal journal that keeps your entries in this browser." />
    <title>Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#entry-title">Skip to the journal form</a>

    <div class="page">
      <header class="site-header">
        <div>
          <h1 class="site-title">Journal</h1>
          <p class="site-tagline">A quiet place to write things down.</p>
        </div>
        <button id="theme-toggle" class="text-btn" type="button" aria-pressed="false">Dark</button>
      </header>

      <main>
        <section class="section" aria-labelledby="form-heading">
          <h2 id="form-heading" class="section__title">New entry</h2>
          <form id="entry-form" class="entry-form" novalidate>
            <div class="field">
              <label for="entry-title">Title</label>
              <input id="entry-title" name="title" type="text" maxlength="120" autocomplete="off" required />
            </div>

            <div class="field-row">
              <div class="field">
                <label for="entry-date">Date</label>
                <input id="entry-date" name="date" type="date" required />
              </div>
              <div class="field">
                <label for="entry-mood">Mood</label>
                <select id="entry-mood" name="mood"></select>
              </div>
            </div>

            <div class="field">
              <label for="entry-content">What happened today?</label>
              <textarea id="entry-content" name="content" rows="7" required></textarea>
            </div>

            <p id="form-error" class="form-error" role="alert" hidden></p>

            <div class="form-actions">
              <button id="entry-submit" class="btn btn--primary" type="submit">Save entry</button>
              <button id="entry-cancel" class="btn btn--ghost" type="button" hidden>Cancel</button>
            </div>
          </form>
        </section>

        <section class="section" aria-labelledby="entries-heading">
          <div class="entries-head">
            <h2 id="entries-heading" class="section__title">Entries</h2>
            <p id="entry-count" class="entry-count" aria-live="polite"></p>
          </div>
          <div id="toolbar" class="toolbar"></div>
          <div id="entry-list" class="entry-list"></div>
        </section>
      </main>

      <footer class="site-footer">
        <p>Entries are saved in this browser only.</p>
      </footer>
    </div>

    <p id="announcer" class="sr-only" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
